# Builds installers for a release tag and publishes them, with the update feed
# files electron-updater reads, to the matching GitHub Release. The `release`
# environment must require reviewer approval before signing and publication.
name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Validate release tag
        shell: bash
        run: |
          node scripts/release-version.mjs check "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify

  package:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Validate release tag
        shell: bash
        run: |
          node scripts/release-version.mjs check "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - name: Require signing credentials
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [[ -z "${!name}" ]]; then echo "Missing signing credential: $name"; exit 1; fi
            done
          else
            for name in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do
              if [[ -z "${!name}" ]]; then echo "Missing signing credential: $name"; exit 1; fi
            done
          fi
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          fi
      - run: pnpm package:desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict apps/desktop/release/mac-arm64/Beale.app
          xcrun stapler validate apps/desktop/release/mac-arm64/Beale.app
      - name: Verify Windows app and installer signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('apps/desktop/release/win-unpacked/Beale.exe') +
            @(Get-ChildItem apps/desktop/release -Filter '*.exe' -File | Select-Object -ExpandProperty FullName)
          if ($files.Count -lt 2) { throw 'Windows app or installer is missing.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Invalid signature on $file`: $($signature.Status)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The numbered changelog section is the release notes.
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          (cd installers && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" installers/* \
            --verify-tag \
            --title "Beale $version" \
            --notes-file notes.md \
            --latest
