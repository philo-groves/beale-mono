name: Release gate

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node scripts/release-version.mjs check "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - name: Check source installer on both OSes
        run: node website/beale-source-installer/install.mjs --dry-run --dir beale-source-check
      - run: pnpm release:verify
