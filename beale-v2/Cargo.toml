[workspace]
members = [
    "apps/beale-app-server/beale-harness/beale-contracts",
    "apps/beale-app-server/beale-harness/beale-core",
    "apps/beale-app-server/beale-harness/beale-extender",
    "apps/beale-app-server/beale-harness/beale-providers",
    "apps/beale-app-server/beale-harness/beale-safety",
    "apps/beale-app-server/beale-harness/beale-sessions",
    "apps/beale-app-server/beale-harness/beale-storage",
    "apps/beale-app-server/beale-harness/beale-tools",
    "apps/beale-app-server/beale-harness/beale-workspaces",
    "apps/beale-desktop-app",
    "extensions/features/beale-fleet",
    "extensions/features/beale-goals",
]
resolver = "3"

[workspace.metadata.beale]
# Placeholder directories become workspace members when they gain manifests.
extension_roots = ["extensions/features", "extensions/plugins", "extensions/research-kits"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
futures-util = "0.3"
jsonwebtoken = "9"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
