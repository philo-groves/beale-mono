[package]
name = "beale-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["goal-mode", "fleet", "graphs", "tracking", "surfaces", "knowledge", "runbooks"]
knowledge = ["beale-sessions/knowledge", "dep:beale-knowledge"]
runbooks = ["beale-sessions/runbooks", "dep:beale-runbooks"]
surfaces = ["beale-sessions/surfaces", "dep:beale-surfaces"]
goal-mode = ["beale-sessions/goal-mode", "dep:beale-goals"]
fleet = ["dep:beale-fleet"]
graphs = ["beale-sessions/graphs", "dep:beale-graphs"]
tracking = ["dep:beale-tracking"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
beale-contracts = { path = "../beale-contracts" }
beale-extender = { path = "../beale-extender" }
beale-fleet = { path = "../../../../extensions/features/beale-fleet", optional = true }
beale-graphs = { path = "../../../../extensions/features/beale-graphs", optional = true }
beale-goals = { path = "../../../../extensions/features/beale-goals", optional = true }
beale-knowledge = { path = "../../../../extensions/features/beale-knowledge", optional = true }
beale-runbooks = { path = "../../../../extensions/features/beale-runbooks", optional = true }
beale-tracking = { path = "../../../../extensions/features/beale-tracking", optional = true }
beale-surfaces = { path = "../../../../extensions/features/beale-surfaces", optional = true }
beale-providers = { path = "../beale-providers" }
beale-safety = { path = "../beale-safety" }
beale-sessions = { path = "../beale-sessions", default-features = false }
beale-storage = { path = "../beale-storage" }
beale-workspaces = { path = "../beale-workspaces" }
prost.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
