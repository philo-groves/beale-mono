syntax = "proto3";
package beale.v1;

message HealthResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string service = 3;
}

enum ProviderId {
  PROVIDER_ID_UNSPECIFIED = 0;
  PROVIDER_ID_OPENAI = 1;
  PROVIDER_ID_XAI = 2;
  PROVIDER_ID_ANTHROPIC = 3;
  PROVIDER_ID_ZAI = 4;
  PROVIDER_ID_OPENROUTER = 5;
  PROVIDER_ID_CUSTOM = 6;
}

message ProviderAuthStatus {
  ProviderId provider = 1;
  bool subscription_configured = 2;
  bool api_key_configured = 3;
  bool login_in_progress = 4;
  string login_error = 5;
  AuthMethod source_priority = 6;
}

message ProviderAuthStatusResponse {
  repeated ProviderAuthStatus providers = 1;
  ProviderId lead_provider = 2;
  DaybreakMode openai_daybreak_mode = 3;
  string lead_custom_provider_id = 4;
}

message ProviderUsageWindow {
  string id = 1;
  string label = 2;
  uint32 used_percent = 3;
  uint64 resets_at_unix = 4;
}

message ProviderUsageSnapshot {
  ProviderId provider = 1;
  uint64 checked_at_unix = 2;
  repeated ProviderUsageWindow windows = 3;
}

message ProviderUsageResponse {
  repeated ProviderUsageSnapshot providers = 1;
}

enum DaybreakMode {
  DAYBREAK_MODE_UNSPECIFIED = 0;
  DAYBREAK_MODE_BLUE = 1;
  DAYBREAK_MODE_RED = 2;
}

message ProviderRequest {
  ProviderId provider = 1;
  string custom_provider_id = 2;
}

message CustomProvider {
  string id = 1;
  string name = 2;
  string base_url = 3;
  repeated ModelEntry models = 4;
  string lead_model = 5;
  string small_model = 6;
  bool reasoning = 7;
  bool api_key_configured = 8;
}

message ListCustomProvidersResponse {
  repeated CustomProvider providers = 1;
}

message SaveCustomProviderRequest {
  CustomProvider provider = 1;
}

message CustomProviderRequest {
  string id = 1;
}

message SetCustomProviderApiKeyRequest {
  string id = 1;
  string api_key = 2;
}

message DiscoverCustomModelsRequest {
  string id = 1;
  string base_url = 2;
  string api_key = 3;
}

message DiscoverCustomModelsResponse {
  repeated ModelEntry models = 1;
}

message SetApiKeyRequest {
  ProviderId provider = 1;
  string api_key = 2;
}

message StartSubscriptionResponse {
  string verification_url = 1;
  string user_code = 2;
  bool launch_official_app = 3;
}

message ControlChallengeRequest {
  bytes nonce = 1;
}

message ControlChallengeResponse {
  bytes proof = 1;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_SUBSCRIPTION = 1;
  AUTH_METHOD_API_KEY = 2;
}

message ListModelsRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
}

message ModelEntry {
  string id = 1;
  string display_name = 2;
}

message ModelCatalogResponse {
  ProviderId provider = 1;
  AuthMethod method = 2;
  repeated ModelEntry models = 3;
  string lead_model = 4;
  string small_model = 5;
}

message SetModelDefaultsRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
  string lead_model = 3;
  string small_model = 4;
}

message SetSourcePriorityRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
}

message SetDaybreakModeRequest {
  DaybreakMode mode = 1;
}

enum SurfaceKind {
  SURFACE_KIND_UNSPECIFIED = 0;
  SURFACE_KIND_REPOSITORY = 1;
  SURFACE_KIND_DOCUMENTATION = 2;
  SURFACE_KIND_BINARY = 3;
  SURFACE_KIND_SERVICE = 4;
  SURFACE_KIND_DOMAIN = 5;
  SURFACE_KIND_OTHER = 6;
}

enum SurfaceScope {
  SURFACE_SCOPE_UNSPECIFIED = 0;
  SURFACE_SCOPE_IN_SCOPE = 1;
  SURFACE_SCOPE_OUT_OF_SCOPE = 2;
}

message WorkspaceSurfaceInput {
  SurfaceKind kind = 1;
  SurfaceScope scope = 2;
  string value = 3;
}

message CreateWorkspaceRequest {
  string name = 1;
  string directory = 2;
  string guidance = 3;
  repeated WorkspaceSurfaceInput surfaces = 4;
  repeated string rules = 5;
}

message WorkspaceSummary {
  string id = 1;
  string name = 2;
  string directory = 3;
}

message ListWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
}

enum SurfaceCreator {
  SURFACE_CREATOR_UNSPECIFIED = 0;
  SURFACE_CREATOR_USER = 1;
  SURFACE_CREATOR_AGENT = 2;
}

message WorkspaceSurface {
  SurfaceKind kind = 1;
  SurfaceScope scope = 2;
  string value = 3;
  SurfaceCreator created_by = 4;
  string out_of_scope_reason = 5;
}

message WorkspaceDetails {
  WorkspaceSummary summary = 1;
  string guidance = 2;
  repeated WorkspaceSurface surfaces = 3;
  repeated string rules = 4;
}

message WorkspaceCampaign {
  repeated string enabled_feature_ids = 1;
}

message WorkspaceFoundation {
  WorkspaceSummary summary = 1;
  string guidance = 2;
  uint64 revision = 3;
}

message UpdateWorkspaceFoundationRequest {
  uint64 expected_revision = 1;
  string name = 2;
  string guidance = 3;
}

message WorkspaceSurfaces {
  repeated WorkspaceSurface surfaces = 1;
  uint64 revision = 2;
}

message UpdateWorkspaceSurfacesRequest {
  uint64 expected_revision = 1;
  repeated WorkspaceSurfaceInput surfaces = 2;
}

message WorkspaceRules {
  repeated string rules = 1;
  uint64 revision = 2;
}

message UpdateWorkspaceRulesRequest {
  uint64 expected_revision = 1;
  repeated string rules = 2;
}

enum SessionRole {
  SESSION_ROLE_UNSPECIFIED = 0;
  SESSION_ROLE_USER = 1;
  SESSION_ROLE_ASSISTANT = 2;
}

message SessionMessage {
  SessionRole role = 1;
  string text = 2;
  repeated SessionToolSummary tools = 3;
  repeated SessionReasoningSummary reasoning_summaries = 4;
  uint64 duration_ms = 5;
  repeated SessionCommentary commentary = 6;
}

message SessionReasoningSummary {
  string text = 1;
  uint32 after_tool_count = 2;
}

message SessionCommentary {
  string text = 1;
  uint32 after_tool_count = 2;
}

enum SessionStreamKind {
  SESSION_STREAM_KIND_UNSPECIFIED = 0;
  SESSION_STREAM_KIND_REASONING_DELTA = 1;
  SESSION_STREAM_KIND_MESSAGE_DELTA = 2;
  SESSION_STREAM_KIND_TOOL_STARTED = 3;
  SESSION_STREAM_KIND_TOOL_FINISHED = 4;
  SESSION_STREAM_KIND_COMPLETED = 5;
  SESSION_STREAM_KIND_FAILED = 6;
  SESSION_STREAM_KIND_TURN_COMPLETED = 7;
}

message SessionStreamEvent {
  SessionStreamKind kind = 1;
  string text = 2;
  SessionToolSummary tool = 3;
  SessionDetail detail = 4;
  uint32 segment_index = 5;
}

message SessionToolSummary {
  string id = 1;
  string name = 2;
  string summary = 3;
  bool is_error = 4;
}

message SessionToolDetailPage {
  string id = 1;
  string name = 2;
  string arguments = 3;
  string output = 4;
  uint64 offset = 5;
  uint64 next_offset = 6;
  uint64 total_bytes = 7;
  bool is_error = 8;
}

message SessionSummary {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  uint64 last_message_at_ms = 4;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message ArchiveEntry {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  string model = 4;
  uint64 turn_count = 5;
  uint64 created_at_ms = 6;
  uint64 archived_at_ms = 7;
  bool quick_chat = 8;
  uint64 last_message_at_ms = 9;
}

message ListArchiveResponse {
  repeated ArchiveEntry entries = 1;
}

message SessionDetail {
  SessionSummary summary = 1;
  repeated SessionMessage messages = 2;
  ProviderId provider = 3;
  AuthMethod method = 4;
  string model = 5;
  SessionGoal goal = 6;
  uint64 first_turn_number = 7; // Earlier turns remain stored when this is greater than one.
}

enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  GOAL_STATUS_ACTIVE = 1;
  GOAL_STATUS_COMPLETE = 2;
  GOAL_STATUS_WAITING = 3;
  GOAL_STATUS_PAUSED = 4;
}

message SessionGoal {
  string objective = 1;
  GoalStatus status = 2;
  uint64 turns_used = 3;
  string required_state = 4;
  uint64 max_turns = 5; // Zero means unlimited.
  uint64 max_duration_minutes = 6; // Zero means unlimited active work time.
  uint64 active_ms = 7;
}

enum ReasoningEffort {
  REASONING_EFFORT_UNSPECIFIED = 0;
  REASONING_EFFORT_NONE = 1;
  REASONING_EFFORT_MINIMAL = 2;
  REASONING_EFFORT_LOW = 3;
  REASONING_EFFORT_MEDIUM = 4;
  REASONING_EFFORT_HIGH = 5;
  REASONING_EFFORT_XHIGH = 6;
  REASONING_EFFORT_MAX = 7;
}

message SubmitSessionTurnRequest {
  string workspace_id = 1;
  string session_id = 2;
  ProviderId provider = 3;
  AuthMethod method = 4;
  string model = 5;
  string prompt = 6;
  ReasoningEffort reasoning_effort = 7;
  bool goal_mode = 8;
  uint64 goal_max_turns = 9; // Zero means unlimited.
  uint64 goal_max_duration_minutes = 10; // Zero means unlimited active work time.
}

message QuickChatTurnRequest {
  string chat_id = 1;
  string prompt = 2;
  string workspace_id = 3;
}

message QuickChatMessage {
  SessionRole role = 1;
  string text = 2;
}

message QuickChatDetail {
  string chat_id = 1;
  string title = 2;
  repeated QuickChatMessage messages = 3;
  string workspace_id = 4;
}

enum ReviewStage {
  REVIEW_STAGE_UNSPECIFIED = 0;
  REVIEW_STAGE_AUTO_REVIEW = 1;
  REVIEW_STAGE_GUARDIAN = 2;
}

message PermissionRule {
  string id = 1;
  ReviewStage stage = 2;
  string title = 3;
  string instruction = 4;
  bool enabled = 5;
}

message PermissionRulesResponse {
  repeated PermissionRule rules = 1;
}

message UpdatePermissionRuleRequest {
  string id = 1;
  string instruction = 2;
  bool enabled = 3;
  string title = 4;
}

message CreatePermissionRuleRequest {
  ReviewStage stage = 1;
  string title = 2;
  string instruction = 3;
}

message PluginSummary {
  string name = 1;
  string description = 2;
  bool installed = 3;
  uint32 skill_count = 4;
  bool has_mcp_server = 5;
  uint32 mcp_server_count = 6;
  uint32 mcp_tool_count = 7;
  repeated string workspace_ids = 8;
  bool all_workspaces = 9;
}

message ListPluginsResponse {
  repeated PluginSummary plugins = 1;
}

message FeatureSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  bool has_prompt_extension = 5;
  uint32 tool_count = 6;
  repeated string workspace_ids = 7;
  bool all_workspaces = 8;
}

message SetExtensionWorkspaceScopeRequest {
  string id = 1;
  repeated string workspace_ids = 2;
  bool all_workspaces = 3;
}

message ListFeaturesResponse {
  repeated FeatureSummary features = 1;
}

message GetFeatureDetailsRequest {
  string id = 1;
}

message FeatureDetailsResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string prompt_extension = 4;
}

message SetFeatureEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message InstallPluginRequest {
  string name = 1;
}

message UninstallPluginRequest {
  string name = 1;
}

message GetPluginManifestRequest {
  string name = 1;
}

message PluginManifestResponse {
  string name = 1;
  string manifest_json = 2;
}

message FleetAppServerDescriptor {
  string service = 1;
  string host_name = 2;
  string os_name = 3;
  string os_vendor = 4;
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;
}

message FleetTotpProvisioningResponse {
  string otpauth_uri = 1;
}

message FleetPairingRequest {
  string code = 1;
}

message FleetPairingResponse {
  string token = 1;
}

message FleetBrowser {
  string id = 1;
  string name = 2;
  bool manual = 3;
  bool available = 4;
  bool enabled = 5;
  bool all_workspaces = 6;
  repeated string workspace_ids = 7;
  bool preferred = 8;
}

message FleetBrowsersResponse {
  repeated FleetBrowser browsers = 1;
}

message FleetAddBrowserRequest {
  string name = 1;
  string executable = 2;
}

message FleetRemoveBrowserRequest {
  string id = 1;
}

message FleetSetBrowserSettingsRequest {
  string id = 1;
  bool enabled = 2;
  bool all_workspaces = 3;
  repeated string workspace_ids = 4;
}

message FleetSetPreferredBrowserRequest {
  string id = 1;
}

message FleetVirtualMachine {
  string id = 1;
  string name = 2;
  string provider = 3;
  string state = 4;
  uint32 generation = 5;
  bool enabled = 6;
  bool all_workspaces = 7;
  repeated string workspace_ids = 8;
  bool can_run = 9;
  bool can_clone = 10;
}

message FleetVirtualMachinesResponse {
  repeated FleetVirtualMachine virtual_machines = 1;
}

message FleetSetVirtualMachineSettingsRequest {
  string id = 1;
  bool enabled = 2;
  bool all_workspaces = 3;
  repeated string workspace_ids = 4;
  bool can_run = 5;
  bool can_clone = 6;
}
