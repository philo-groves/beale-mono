syntax = "proto3";
package beale.v1;

message HealthResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string service = 3;
}

enum ProviderId {
  PROVIDER_ID_UNSPECIFIED = 0;
  PROVIDER_ID_OPENAI = 1;
  PROVIDER_ID_XAI = 2;
  PROVIDER_ID_ANTHROPIC = 3;
  PROVIDER_ID_ZAI = 4;
  PROVIDER_ID_OPENROUTER = 5;
  PROVIDER_ID_CUSTOM = 6;
}

message ProviderAuthStatus {
  ProviderId provider = 1;
  bool subscription_configured = 2;
  bool api_key_configured = 3;
  bool login_in_progress = 4;
  string login_error = 5;
  AuthMethod source_priority = 6;
}

message ProviderAuthStatusResponse {
  repeated ProviderAuthStatus providers = 1;
  ProviderId lead_provider = 2;
  DaybreakMode openai_daybreak_mode = 3;
  string lead_custom_provider_id = 4;
}

message ProviderUsageWindow {
  string id = 1;
  string label = 2;
  uint32 used_percent = 3;
  uint64 resets_at_unix = 4;
}

message ProviderUsageSnapshot {
  ProviderId provider = 1;
  uint64 checked_at_unix = 2;
  repeated ProviderUsageWindow windows = 3;
}

message ProviderUsageResponse {
  repeated ProviderUsageSnapshot providers = 1;
}

message TrackingSubscriptionPoint {
  ProviderId provider = 1;
  string window_id = 2;
  string label = 3;
  uint64 observed_at_ms = 4;
  uint32 remaining_percent = 5;
  uint64 resets_at_unix = 6;
}

message TrackingModelDay {
  uint64 day_start_ms = 1;
  ProviderId provider = 2;
  AuthMethod method = 3;
  string model = 4;
  string role = 5;
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
  uint64 duration_ms = 8;
  uint32 measured_calls = 9;
  uint32 total_calls = 10;
}

message TrackingResponse {
  repeated TrackingSubscriptionPoint subscriptions = 1;
  repeated TrackingModelDay model_days = 2;
}

enum DaybreakMode {
  DAYBREAK_MODE_UNSPECIFIED = 0;
  DAYBREAK_MODE_BLUE = 1;
  DAYBREAK_MODE_RED = 2;
}

message ProviderRequest {
  ProviderId provider = 1;
  string custom_provider_id = 2;
}

message CustomProvider {
  string id = 1;
  string name = 2;
  string base_url = 3;
  repeated ModelEntry models = 4;
  string lead_model = 5;
  string small_model = 6;
  bool reasoning = 7;
  bool api_key_configured = 8;
}

message ListCustomProvidersResponse {
  repeated CustomProvider providers = 1;
}

message SaveCustomProviderRequest {
  CustomProvider provider = 1;
}

message CustomProviderRequest {
  string id = 1;
}

message SetCustomProviderApiKeyRequest {
  string id = 1;
  string api_key = 2;
}

message DiscoverCustomModelsRequest {
  string id = 1;
  string base_url = 2;
  string api_key = 3;
}

message DiscoverCustomModelsResponse {
  repeated ModelEntry models = 1;
}

message SetApiKeyRequest {
  ProviderId provider = 1;
  string api_key = 2;
}

message StartSubscriptionResponse {
  string verification_url = 1;
  string user_code = 2;
  bool launch_official_app = 3;
}

message ControlChallengeRequest {
  bytes nonce = 1;
}

message ControlChallengeResponse {
  bytes proof = 1;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  AUTH_METHOD_SUBSCRIPTION = 1;
  AUTH_METHOD_API_KEY = 2;
}

message ListModelsRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
}

message ModelEntry {
  string id = 1;
  string display_name = 2;
}

message ModelCatalogResponse {
  ProviderId provider = 1;
  AuthMethod method = 2;
  repeated ModelEntry models = 3;
  string lead_model = 4;
  string small_model = 5;
}

message SetModelDefaultsRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
  string lead_model = 3;
  string small_model = 4;
}

message SetSourcePriorityRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
}

message SetDaybreakModeRequest {
  DaybreakMode mode = 1;
}

enum SurfaceKind {
  SURFACE_KIND_UNSPECIFIED = 0;
  SURFACE_KIND_REPOSITORY = 1;
  SURFACE_KIND_DOCUMENTATION = 2;
  SURFACE_KIND_BINARY = 3;
  SURFACE_KIND_SERVICE = 4;
  SURFACE_KIND_DOMAIN = 5;
  SURFACE_KIND_OTHER = 6;
}

enum SurfaceScope {
  SURFACE_SCOPE_UNSPECIFIED = 0;
  SURFACE_SCOPE_IN_SCOPE = 1;
  SURFACE_SCOPE_OUT_OF_SCOPE = 2;
}

enum SurfaceScopeState {
  SURFACE_SCOPE_STATE_UNKNOWN = 0;
  SURFACE_SCOPE_STATE_CANDIDATE = 1;
  SURFACE_SCOPE_STATE_APPROVED = 2;
}

message WorkspaceSurfaceInput {
  string id = 1;
  SurfaceDefinition definition = 2;
  repeated SurfaceRelationship relationships = 3;
}

message SurfaceRelationship {
  string target_id = 1;
  string label = 2;
  string type_id = 3;
  repeated SurfaceEvidence evidence_refs = 4;
  string source_element_id = 5;
}

message SurfaceEvidence {
  string kind = 1;
  string reference = 2;
  string note = 3;
}

message SurfaceLocator {
  string kind = 1;
  string value = 2;
}

message SurfaceDefinition {
  string type_id = 1;
  string name = 2;
  SurfaceLocator locator = 3;
  SurfaceScope scope = 4;
  SurfaceScopeState scope_state = 5;
  string description = 6;
  string out_of_scope_reason = 7;
  repeated SurfaceEvidence evidence_refs = 8;
}

message SurfaceChange {
  string field = 1;
  string before_json = 2;
  string after_json = 3;
}

message SurfaceRevision {
  uint64 number = 1;
  uint64 at_ms = 2;
  string actor = 3;
  string action = 4;
  repeated SurfaceChange changes = 5;
}

message CreateWorkspaceRequest {
  string name = 1;
  string directory = 2;
  string guidance = 3;
  repeated WorkspaceSurfaceInput surfaces = 4;
  repeated string rules = 5;
}

message WorkspaceImportRequest {
  ProviderId provider = 1;
  AuthMethod method = 2;
  string model = 3;
  string instructions = 4;
}

message WorkspaceImportResult {
  string name = 1;
  string guidance = 2;
  repeated WorkspaceSurfaceInput surfaces = 3;
  repeated string rules = 4;
}

enum WorkspaceImportEventKind {
  WORKSPACE_IMPORT_EVENT_KIND_UNSPECIFIED = 0;
  WORKSPACE_IMPORT_EVENT_KIND_PROGRESS = 1;
  WORKSPACE_IMPORT_EVENT_KIND_COMPLETED = 2;
  WORKSPACE_IMPORT_EVENT_KIND_FAILED = 3;
}

message WorkspaceImportEvent {
  WorkspaceImportEventKind kind = 1;
  string text = 2;
  WorkspaceImportResult result = 3;
}

message WorkspaceSummary {
  string id = 1;
  string name = 2;
  string directory = 3;
}

message ListWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
}

message WorkspaceSurface {
  string id = 1;
  SurfaceDefinition definition = 2;
  repeated SurfaceRelationship relationships = 3;
  repeated SurfaceRevision lineage = 4;
}

enum SurfaceMapCategory {
  SURFACE_MAP_CATEGORY_UNSPECIFIED = 0;
  SURFACE_MAP_CATEGORY_COMPONENT = 1;
  SURFACE_MAP_CATEGORY_INTERFACE = 2;
  SURFACE_MAP_CATEGORY_BEHAVIOR = 3;
  SURFACE_MAP_CATEGORY_STATE = 4;
  SURFACE_MAP_CATEGORY_CONTROL = 5;
}

enum SurfaceMapBasis {
  SURFACE_MAP_BASIS_UNSPECIFIED = 0;
  SURFACE_MAP_BASIS_OBSERVED = 1;
  SURFACE_MAP_BASIS_REPORTED = 2;
  SURFACE_MAP_BASIS_INFERRED = 3;
}

enum SurfaceMapFlowKind {
  SURFACE_MAP_FLOW_KIND_UNSPECIFIED = 0;
  SURFACE_MAP_FLOW_KIND_CALL = 1;
  SURFACE_MAP_FLOW_KIND_DATA = 2;
  SURFACE_MAP_FLOW_KIND_CONTROL = 3;
  SURFACE_MAP_FLOW_KIND_EVENT = 4;
}

enum SurfaceMapGapReason {
  SURFACE_MAP_GAP_REASON_UNSPECIFIED = 0;
  SURFACE_MAP_GAP_REASON_NOT_EXAMINED = 1;
  SURFACE_MAP_GAP_REASON_UNAVAILABLE = 2;
  SURFACE_MAP_GAP_REASON_AMBIGUOUS = 3;
}

message SurfaceMapElement {
  string id = 1;
  SurfaceMapCategory category = 2;
  string type_id = 3;
  string name = 4;
  SurfaceLocator locator = 5;
  string observation = 6;
  SurfaceMapBasis basis = 7;
  uint64 observed_at_ms = 8;
  repeated SurfaceEvidence evidence_refs = 9;
}

message SurfaceMapFlow {
  string id = 1;
  string from_element_id = 2;
  string to_element_id = 3;
  SurfaceMapFlowKind kind = 4;
  string observation = 5;
  SurfaceMapBasis basis = 6;
  repeated SurfaceEvidence evidence_refs = 7;
}

message SurfaceMapGap {
  string id = 1;
  string element_id = 2;
  string question = 3;
  SurfaceMapGapReason reason = 4;
  repeated SurfaceEvidence evidence_refs = 5;
}

message WorkspaceSurfaceMapping {
  string surface_id = 1;
  uint64 revision = 2;
  repeated SurfaceMapElement elements = 3;
  repeated SurfaceMapFlow flows = 4;
  repeated SurfaceMapGap gaps = 5;
  uint64 next_element_number = 6;
  uint64 next_flow_number = 7;
  uint64 next_gap_number = 8;
}

message UpdateWorkspaceSurfaceMappingRequest {
  uint64 expected_revision = 1;
  repeated SurfaceMapElement elements = 2;
  repeated SurfaceMapFlow flows = 3;
  repeated SurfaceMapGap gaps = 4;
}

enum SurfaceThreatMapRefKind {
  SURFACE_THREAT_MAP_REF_KIND_UNSPECIFIED = 0;
  SURFACE_THREAT_MAP_REF_KIND_ELEMENT = 1;
  SURFACE_THREAT_MAP_REF_KIND_FLOW = 2;
}

enum SurfaceThreatDisposition {
  SURFACE_THREAT_DISPOSITION_UNSPECIFIED = 0;
  SURFACE_THREAT_DISPOSITION_OPEN = 1;
  SURFACE_THREAT_DISPOSITION_DISMISSED = 2;
}

message SurfaceThreatMapRef {
  SurfaceThreatMapRefKind kind = 1;
  string id = 2;
}

message SurfaceThreatScenario {
  string id = 1;
  string title = 2;
  repeated SurfaceThreatMapRef map_refs = 3;
  string attacker_position = 4;
  repeated string preconditions = 5;
  string suspected_failure = 6;
  string invariant_at_risk = 7;
  string potential_impact = 8;
  string validation_question = 9;
  repeated SurfaceEvidence evidence_refs = 10;
  SurfaceThreatDisposition disposition = 11;
  string disposition_reason = 12;
  repeated string related_claim_ids = 13;
}

message WorkspaceSurfaceThreatModel {
  string surface_id = 1;
  uint64 revision = 2;
  uint64 reviewed_mapping_revision = 3;
  repeated SurfaceThreatScenario scenarios = 4;
  uint64 next_scenario_number = 5;
}

message UpdateWorkspaceSurfaceThreatModelRequest {
  uint64 expected_revision = 1;
  uint64 reviewed_mapping_revision = 2;
  repeated SurfaceThreatScenario scenarios = 3;
}

message WorkspaceDetails {
  WorkspaceSummary summary = 1;
  string guidance = 2;
  repeated WorkspaceSurface surfaces = 3;
  repeated string rules = 4;
}

message WorkspaceCampaign {
  repeated string enabled_feature_ids = 1;
}

message WorkspaceFoundation {
  WorkspaceSummary summary = 1;
  string guidance = 2;
  uint64 revision = 3;
}

message UpdateWorkspaceFoundationRequest {
  uint64 expected_revision = 1;
  string name = 2;
  string guidance = 3;
}

message WorkspaceSurfaces {
  repeated WorkspaceSurface surfaces = 1;
  uint64 revision = 2;
}

message UpdateWorkspaceSurfacesRequest {
  uint64 expected_revision = 1;
  repeated WorkspaceSurfaceInput surfaces = 2;
}

message WorkspaceRules {
  repeated string rules = 1;
  uint64 revision = 2;
}

message UpdateWorkspaceRulesRequest {
  uint64 expected_revision = 1;
  repeated string rules = 2;
}

enum SessionRole {
  SESSION_ROLE_UNSPECIFIED = 0;
  SESSION_ROLE_USER = 1;
  SESSION_ROLE_ASSISTANT = 2;
}

message SessionMessage {
  SessionRole role = 1;
  string text = 2;
  repeated SessionToolSummary tools = 3;
  repeated SessionReasoningSummary reasoning_summaries = 4;
  uint64 duration_ms = 5;
  repeated SessionCommentary commentary = 6;
}

message SessionReasoningSummary {
  string text = 1;
  uint32 after_tool_count = 2;
}

message SessionCommentary {
  string text = 1;
  uint32 after_tool_count = 2;
}

enum SessionStreamKind {
  SESSION_STREAM_KIND_UNSPECIFIED = 0;
  SESSION_STREAM_KIND_REASONING_DELTA = 1;
  SESSION_STREAM_KIND_MESSAGE_DELTA = 2;
  SESSION_STREAM_KIND_TOOL_STARTED = 3;
  SESSION_STREAM_KIND_TOOL_FINISHED = 4;
  SESSION_STREAM_KIND_COMPLETED = 5;
  SESSION_STREAM_KIND_FAILED = 6;
  SESSION_STREAM_KIND_TURN_COMPLETED = 7;
  SESSION_STREAM_KIND_SUBAGENTS_SPAWNED = 8;
  SESSION_STREAM_KIND_RUNBOOK_PROGRESS = 9;
}

message SessionStreamEvent {
  SessionStreamKind kind = 1;
  string text = 2;
  SessionToolSummary tool = 3;
  SessionDetail detail = 4;
  uint32 segment_index = 5;
  RunbookProgress runbook_progress = 6;
}

message RunbookProgress {
  string runbook_id = 1;
  string title = 2;
  uint32 cell_number = 3;
  string cell_name = 4;
}

message SessionToolSummary {
  string id = 1;
  string name = 2;
  string summary = 3;
  bool is_error = 4;
}

message SessionToolDetailPage {
  string id = 1;
  string name = 2;
  string arguments = 3;
  string output = 4;
  uint64 offset = 5;
  uint64 next_offset = 6;
  uint64 total_bytes = 7;
  bool is_error = 8;
}

message SessionSummary {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  uint64 last_message_at_ms = 4;
}

message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

message ArchiveEntry {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  string model = 4;
  uint64 turn_count = 5;
  uint64 created_at_ms = 6;
  uint64 archived_at_ms = 7;
  bool quick_chat = 8;
  uint64 last_message_at_ms = 9;
}

message ListArchiveResponse {
  repeated ArchiveEntry entries = 1;
}

message SessionDetail {
  SessionSummary summary = 1;
  repeated SessionMessage messages = 2;
  ProviderId provider = 3;
  AuthMethod method = 4;
  string model = 5;
  SessionGoal goal = 6;
  uint64 first_turn_number = 7; // Earlier turns remain stored when this is greater than one.
  string graph_id = 8; // Empty when the session has no orchestration graph.
  repeated GraphNodeModel graph_models = 9; // Saved role model choices; graph execution is separate.
  repeated GraphNodeConcurrency graph_node_concurrency = 10; // Configured per-role maximums.
  uint64 total_duration_ms = 11; // Sum of saved turn durations, including turns outside the recent transcript.
  bool has_campaign_activity = 12; // A successful campaign creation or graph delegation call occurred in any saved turn.
  SessionTokenUsage token_usage = 13; // All saved main and subagent model calls, including turns outside the recent transcript.
  repeated SessionUsageSnapshot usage_snapshots = 14; // Cumulative usage at five-minute active-work intervals, plus the latest partial interval.
  uint64 runbook_count = 15; // Distinct runbooks created, edited, or run in this session.
  uint64 active_runbook_count = 16; // Runbooks with an execution currently in progress.
  repeated SessionRunbook runbooks = 17; // Runbooks created, edited, or run in this session.
}

message SessionRunbook {
  string id = 1;
  string title = 2;
  string status = 3; // running, prepared, or done.
  uint64 updated_at_ms = 4;
  uint64 completed_at_ms = 5;
  uint32 current_cell_number = 6;
  string current_cell_name = 7;
}

message SessionTokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 measured_calls = 3;
  uint64 total_calls = 4;
  uint64 cache_read_tokens = 5;
  uint64 cache_input_tokens = 6; // Input tokens only from calls with reported cache-read telemetry.
  uint64 cache_measured_calls = 7;
}

message SessionUsageSnapshot {
  uint64 work_duration_ms = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 cache_read_tokens = 4;
  uint64 cache_input_tokens = 5;
  uint64 measured_calls = 6;
  uint64 total_calls = 7;
  uint64 cache_measured_calls = 8;
}

message GraphNodeModel {
  string node_id = 1;
  ProviderId provider = 2;
  AuthMethod method = 3;
  string model = 4;
}

message GraphNodeConcurrency {
  string node_id = 1;
  uint32 max_concurrent = 2; // Positive; an absent role has no configured maximum.
}

message SessionGraphConfig {
  repeated GraphNodeModel models = 1;
  repeated GraphNodeConcurrency concurrency = 2;
}

enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  GOAL_STATUS_ACTIVE = 1;
  GOAL_STATUS_COMPLETE = 2;
  GOAL_STATUS_WAITING = 3;
  GOAL_STATUS_PAUSED = 4;
}

message SessionGoal {
  string objective = 1;
  GoalStatus status = 2;
  uint64 turns_used = 3;
  string required_state = 4;
  uint64 max_turns = 5; // Zero means unlimited.
  uint64 max_duration_minutes = 6; // Zero means unlimited active work time.
  uint64 active_ms = 7;
}

enum ReasoningEffort {
  REASONING_EFFORT_UNSPECIFIED = 0;
  REASONING_EFFORT_NONE = 1;
  REASONING_EFFORT_MINIMAL = 2;
  REASONING_EFFORT_LOW = 3;
  REASONING_EFFORT_MEDIUM = 4;
  REASONING_EFFORT_HIGH = 5;
  REASONING_EFFORT_XHIGH = 6;
  REASONING_EFFORT_MAX = 7;
}

message SubmitSessionTurnRequest {
  string workspace_id = 1;
  string session_id = 2;
  ProviderId provider = 3;
  AuthMethod method = 4;
  string model = 5;
  string prompt = 6;
  ReasoningEffort reasoning_effort = 7;
  bool goal_mode = 8;
  uint64 goal_max_turns = 9; // Zero means unlimited.
  uint64 goal_max_duration_minutes = 10; // Zero means unlimited active work time.
  string repeat_preset = 11; // Empty for no repeat; accepted only on the first turn.
  string graph_id = 12; // Chosen graph on the first turn; empty for no graph or later turns.
  repeated GraphNodeModel graph_models = 13; // Role model choices on the first turn only.
  repeated GraphNodeConcurrency graph_node_concurrency = 14; // Per-role maximums on the first turn only.
}

message AutomationJob {
  string id = 1;
  string session_id = 2;
  string workspace_id = 3;
  string title = 4;
  string repeat_preset = 5;
  uint64 next_run_at_ms = 6;
  uint64 last_run_at_ms = 7;
  bool canceled = 8;
}

message ListAutomationJobsResponse {
  repeated AutomationJob jobs = 1;
  repeated AutomationRun runs = 2;
}

enum AutomationRunStatus {
  AUTOMATION_RUN_STATUS_UNSPECIFIED = 0;
  AUTOMATION_RUN_STATUS_ACTIVE = 1;
  AUTOMATION_RUN_STATUS_COMPLETE = 2;
  AUTOMATION_RUN_STATUS_FAILED = 3;
  AUTOMATION_RUN_STATUS_INTERRUPTED = 4;
}

message AutomationRun {
  string id = 1;
  string job_id = 2;
  string session_id = 3;
  string title = 4;
  uint64 started_at_ms = 5;
  uint64 completed_at_ms = 6;
  AutomationRunStatus status = 7;
  string error = 8;
}

message CancelAutomationRequest {
  string id = 1;
  bool series = 2; // False skips the next occurrence.
}

message QuickChatTurnRequest {
  string chat_id = 1;
  string prompt = 2;
  string workspace_id = 3;
}

message QuickChatMessage {
  SessionRole role = 1;
  string text = 2;
}

message QuickChatDetail {
  string chat_id = 1;
  string title = 2;
  repeated QuickChatMessage messages = 3;
  string workspace_id = 4;
}

enum ReviewStage {
  REVIEW_STAGE_UNSPECIFIED = 0;
  REVIEW_STAGE_AUTO_REVIEW = 1;
  REVIEW_STAGE_GUARDIAN = 2;
}

message PermissionRule {
  string id = 1;
  ReviewStage stage = 2;
  string title = 3;
  string instruction = 4;
  bool enabled = 5;
}

message PermissionRulesResponse {
  repeated PermissionRule rules = 1;
}

message UpdatePermissionRuleRequest {
  string id = 1;
  string instruction = 2;
  bool enabled = 3;
  string title = 4;
}

message CreatePermissionRuleRequest {
  ReviewStage stage = 1;
  string title = 2;
  string instruction = 3;
}

message PluginSummary {
  string name = 1;
  string description = 2;
  bool installed = 3;
  uint32 skill_count = 4;
  bool has_mcp_server = 5;
  uint32 mcp_server_count = 6;
  uint32 mcp_tool_count = 7;
  repeated string workspace_ids = 8;
  bool all_workspaces = 9;
  uint32 script_count = 10;
  uint32 reference_count = 11;
  uint32 asset_count = 12;
  uint32 mcp_prompt_count = 13;
  uint32 mcp_resource_count = 14;
}

message ListPluginsResponse {
  repeated PluginSummary plugins = 1;
}

message FeatureSummary {
  string id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  bool has_prompt_extension = 5;
  uint32 tool_count = 6;
  repeated string workspace_ids = 7;
  bool all_workspaces = 8;
}

message SetExtensionWorkspaceScopeRequest {
  string id = 1;
  repeated string workspace_ids = 2;
  bool all_workspaces = 3;
}

message ListFeaturesResponse {
  repeated FeatureSummary features = 1;
}

message GetFeatureDetailsRequest {
  string id = 1;
}

message FeatureDetailsResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string prompt_extension = 4;
  repeated string tool_names = 5;
}

message SetFeatureEnabledRequest {
  string id = 1;
  bool enabled = 2;
}

message InstallPluginRequest {
  string name = 1;
}

message UninstallPluginRequest {
  string name = 1;
}

message GetPluginManifestRequest {
  string name = 1;
}

message PluginManifestResponse {
  string name = 1;
  string manifest_json = 2;
  repeated string tool_names = 3;
}

message FleetAppServerDescriptor {
  string service = 1;
  string host_name = 2;
  string os_name = 3;
  string os_vendor = 4;
  uint32 protocol_major = 5;
  uint32 protocol_minor = 6;
}

message FleetTotpProvisioningResponse {
  string otpauth_uri = 1;
}

message FleetPairingRequest {
  string code = 1;
}

message FleetPairingResponse {
  string token = 1;
}

message FleetBrowser {
  string id = 1;
  string name = 2;
  bool manual = 3;
  bool available = 4;
  bool enabled = 5;
  bool all_workspaces = 6;
  repeated string workspace_ids = 7;
  bool preferred = 8;
}

message FleetBrowsersResponse {
  repeated FleetBrowser browsers = 1;
}

message FleetAddBrowserRequest {
  string name = 1;
  string executable = 2;
}

message FleetRemoveBrowserRequest {
  string id = 1;
}

message FleetSetBrowserSettingsRequest {
  string id = 1;
  bool enabled = 2;
  bool all_workspaces = 3;
  repeated string workspace_ids = 4;
}

message FleetSetPreferredBrowserRequest {
  string id = 1;
}

message FleetVirtualMachine {
  string id = 1;
  string name = 2;
  string provider = 3;
  string state = 4;
  uint32 generation = 5;
  bool enabled = 6;
  bool all_workspaces = 7;
  repeated string workspace_ids = 8;
  bool can_run = 9;
  bool can_clone = 10;
}

message FleetVirtualMachinesResponse {
  repeated FleetVirtualMachine virtual_machines = 1;
}

message FleetSetVirtualMachineSettingsRequest {
  string id = 1;
  bool enabled = 2;
  bool all_workspaces = 3;
  repeated string workspace_ids = 4;
  bool can_run = 5;
  bool can_clone = 6;
}
