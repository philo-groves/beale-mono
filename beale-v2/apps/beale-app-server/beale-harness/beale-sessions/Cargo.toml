[package]
name = "beale-sessions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["goal-mode"]
goal-mode = ["dep:beale-goals"]
graphs = ["dep:beale-graphs"]
surfaces = ["dep:beale-surfaces"]
knowledge = ["dep:beale-knowledge"]
runbooks = ["dep:beale-runbooks"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
beale-contracts = { path = "../beale-contracts" }
beale-extender = { path = "../beale-extender" }
beale-goals = { path = "../../../../extensions/features/beale-goals", optional = true }
beale-graphs = { path = "../../../../extensions/features/beale-graphs", optional = true }
beale-knowledge = { path = "../../../../extensions/features/beale-knowledge", optional = true }
beale-runbooks = { path = "../../../../extensions/features/beale-runbooks", optional = true }
beale-surfaces = { path = "../../../../extensions/features/beale-surfaces", optional = true }
beale-providers = { path = "../beale-providers" }
beale-safety = { path = "../beale-safety" }
beale-storage = { path = "../beale-storage" }
beale-tools = { path = "../beale-tools" }
beale-workspaces = { path = "../beale-workspaces" }
futures-util.workspace = true
prost.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = "0.5"
