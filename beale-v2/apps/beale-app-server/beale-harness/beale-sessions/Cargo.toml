[package]
name = "beale-sessions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
webfetch = ["dep:beale-webfetch"]
default = []
agent-feedback = ["dep:beale-agent-feedback"]
swarms = ["dep:beale-swarms", "dep:reqwest"]
surfaces = ["dep:beale-surfaces"]
findings = ["dep:beale-findings"]
memories = ["dep:beale-memories"]
runbooks = ["dep:beale-runbooks"]

[dependencies]
beale-feature-api = { path = "../beale-feature-api" }
beale-host-log = { path = "../beale-host-log" }
beale-webfetch = { path = "../../../../extensions/features/beale-webfetch", optional = true }
beale-fleet = { path = "../beale-fleet" }
anyhow.workspace = true
axum.workspace = true
beale-agent-loop = { path = "../beale-agent-loop" }
beale-contracts = { path = "../beale-contracts" }
beale-agent-feedback = { path = "../../../../extensions/features/beale-agent-feedback", optional = true }
beale-extender = { path = "../beale-extender" }
beale-goals = { path = "../beale-goals" }
beale-swarms = { path = "../../../../extensions/features/beale-swarms", optional = true }
beale-findings = { path = "../../../../extensions/features/beale-findings", optional = true }
beale-memories = { path = "../../../../extensions/features/beale-memories", optional = true }
beale-runbooks = { path = "../../../../extensions/features/beale-runbooks", optional = true }
beale-surfaces = { path = "../../../../extensions/features/beale-surfaces", optional = true }
beale-providers = { path = "../beale-providers" }
beale-safety = { path = "../beale-safety" }
beale-storage = { path = "../beale-storage" }
beale-tools = { path = "../beale-tools" }
beale-workspaces = { path = "../beale-workspaces" }
futures-util.workspace = true
prost.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest = { workspace = true, optional = true }
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = "0.5"
