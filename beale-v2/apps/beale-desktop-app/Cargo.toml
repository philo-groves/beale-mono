[package]
name = "beale-desktop-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
beale-graphs = { path = "../../extensions/features/beale-graphs" }
beale-knowledge = { path = "../../extensions/features/beale-knowledge" }
beale-runbooks = { path = "../../extensions/features/beale-runbooks" }
beale-tracking = { path = "../../extensions/features/beale-tracking" }
beale-surfaces = { path = "../../extensions/features/beale-surfaces" }
chrono = "0.4"
beale-contracts = { path = "../beale-app-server/beale-harness/beale-contracts" }
futures-util.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
prost.workspace = true
qrcodegen = "1.8"
reqwest.workspace = true
rune = { git = "https://github.com/anomalyco/rune", rev = "0ec97aa4b764b35196ba8f4d133c9722f4b37a6c", default-features = false, features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ec97aa4b764b35196ba8f4d133c9722f4b37a6c", default-features = false, features = ["markdown"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

